<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Focus Group Scanner</title>
<style>
  body { font: 14px system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; color: #0f172a; }
  h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; color: #475569; font-size: 12px; }
  button { display: block; width: 100%; padding: 8px; margin-top: 8px; border: 0; border-radius: 6px;
           background: #0f172a; color: white; font-weight: 500; cursor: pointer; }
  button.secondary { background: white; color: #0f172a; border: 1px solid #cbd5e1; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .status { font-size: 12px; color: #475569; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <h1>Focus Group Scanner</h1>
  <div class="row"><span>Last scan</span><span id="last-scan">—</span></div>
  <div class="row"><span>Tracked sources</span><span id="source-count">—</span></div>
  <div class="row"><span>With scraper</span><span id="scraper-count">—</span></div>
  <button id="scan-btn">Scan now</button>
  <button id="open-changed-btn">Open changed in tabs</button>
  <button id="open-all-btn" class="secondary">Open all (force)</button>
  <button id="dash-btn" class="secondary">Open dashboard</button>
  <button id="options-btn" class="secondary">Options</button>
  <button id="test-btn" class="secondary">Test on current tab</button>
  <div class="status" id="status"></div>
  <pre id="test-output" style="margin: 8px 0 0; padding: 6px; font: 11px ui-monospace, monospace; background: #f1f5f9; border-radius: 4px; max-height: 200px; overflow: auto; display: none;"></pre>
  <script type="module" src="popup.js"></script>
</body>
</html>
